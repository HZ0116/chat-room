<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🔴 红中密聊</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 50%, #334155 100%);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #e2e8f0;
  }

  /* ===== 登录面板 ===== */
  .login-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    display: flex; align-items: center; justify-content: center;
    z-index: 200;
    backdrop-filter: blur(8px);
  }
  .login-box {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 20px;
    padding: 36px 32px;
    width: 90%; max-width: 380px;
    text-align: center;
    box-shadow: 0 25px 80px rgba(0,0,0,0.5);
  }
  .login-box h2 { font-size: 24px; margin-bottom: 6px; }
  .login-box .sub { font-size: 13px; color: #64748b; margin-bottom: 24px; }

  /* ===== 红中密聊 专属标题样式 ===== */
  .special-title {
    font-size: 28px !important;
    font-weight: 900 !important;
    letter-spacing: 6px;
    background: linear-gradient(135deg, #ef4444, #f59e0b, #ef4444);
    background-size: 200% 200%;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: titleShine 3s ease infinite;
    text-shadow: none;
    filter: drop-shadow(0 0 8px rgba(239,68,68,0.3));
  }
  @keyframes titleShine {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .login-box label { display: block; text-align: left; font-size: 12px; color: #94a3b8; margin-bottom: 4px; margin-top: 12px; }
  .login-box input {
    width: 100%; padding: 12px 16px;
    background: #0f172a; border: 1px solid #334155; border-radius: 12px;
    color: #e2e8f0; font-size: 15px; outline: none; transition: border-color .2s;
  }
  .login-box input:focus { border-color: #6366f1; }
  .login-box button {
    width: 100%; margin-top: 22px; padding: 14px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff; border: none; border-radius: 12px;
    font-size: 16px; font-weight: 700; cursor: pointer;
    transition: transform .15s, box-shadow .15s;
  }
  .login-box button:hover { transform: translateY(-1px); box-shadow: 0 6px 20px rgba(99,102,241,0.4); }
  .status-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .status-dot.connecting { background: #f59e0b; animation: pulse 1.5s infinite; }
  .status-dot.connected { background: #4ade80; }
  .status-dot.disconnected { background: #ef4444; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

  /* ===== 聊天主界面 ===== */
  .chat-container {
    width: 100%; max-width: 520px; height: 92vh;
    background: #1e293b; border-radius: 20px;
    box-shadow: 0 25px 80px rgba(0,0,0,0.5);
    display: flex; flex-direction: column; overflow: hidden;
    border: 1px solid #334155;
  }
  .chat-header {
    background: linear-gradient(135deg, #1e293b, #0f172a);
    border-bottom: 1px solid #334155;
    padding: 16px 20px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .chat-header .title { font-size: 18px; font-weight: 700; letter-spacing: 2px; }
  .chat-header .room-info { font-size: 12px; color: #64748b; margin-top: 2px; }
  .chat-header .right { display: flex; align-items: center; gap: 12px; }
  .online-badge {
    background: #064e3b; color: #6ee7b7;
    font-size: 11px; padding: 4px 10px; border-radius: 20px;
    font-weight: 600;
  }

  /* ===== 消息区 ===== */
  .messages {
    flex: 1; overflow-y: auto; padding: 16px 18px;
    display: flex; flex-direction: column; gap: 8px;
  }
  .messages::-webkit-scrollbar { width: 5px; }
  .messages::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }

  .msg {
    max-width: 78%; padding: 10px 14px;
    border-radius: 14px; font-size: 14px; line-height: 1.55;
    word-wrap: break-word; animation: fadeIn .25s ease;
  }
  @keyframes fadeIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:translateY(0)} }

  .msg-self {
    align-self: flex-end;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff; border-bottom-right-radius: 4px;
  }
  .msg-other {
    align-self: flex-start;
    background: #334155; color: #e2e8f0;
    border-bottom-left-radius: 4px;
  }
  .msg-system {
    align-self: center; font-size: 11px; color: #64748b;
    background: transparent; padding: 2px 8px;
  }
  .msg-author { font-size: 11px; color: #a78bfa; font-weight: 600; margin-bottom: 3px; }
  .msg-self .msg-author { color: rgba(255,255,255,0.85); }
  .msg-time { font-size: 10px; color: rgba(255,255,255,0.5); margin-top: 3px; text-align: right; }
  .msg-other .msg-time { color: #64748b; text-align: left; }

  /* 正在输入 */
  .typing-indicator {
    align-self: flex-start; font-size: 12px; color: #64748b;
    padding: 4px 12px; font-style: italic;
    min-height: 22px;
  }

  /* ===== 输入区 ===== */
  .input-area {
    display: flex; padding: 12px 14px;
    background: #0f172a; border-top: 1px solid #334155; gap: 10px;
  }
  .input-area input {
    flex: 1; padding: 12px 18px;
    background: #1e293b; border: 1px solid #334155; border-radius: 24px;
    color: #e2e8f0; font-size: 14px; outline: none; transition: border-color .2s;
  }
  .input-area input:focus { border-color: #6366f1; }
  .input-area button {
    padding: 12px 22px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    color: #fff; border: none; border-radius: 24px;
    font-size: 14px; font-weight: 700; cursor: pointer;
    transition: transform .15s;
  }
  .input-area button:hover { transform: translateY(-1px); }
  .input-area button:disabled { opacity: 0.4; cursor: not-allowed; }

  /* 在线列表弹窗 */
  .online-panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: 260px;
    background: #1e293b; border-left: 1px solid #334155;
    transform: translateX(100%); transition: transform .3s;
    z-index: 150; padding: 20px;
    overflow-y: auto;
  }
  .online-panel.open { transform: translateX(0); }
  .online-panel h3 { font-size: 15px; margin-bottom: 14px; color: #94a3b8; }
  .online-user {
    padding: 10px 12px; border-radius: 10px;
    background: #334155; margin-bottom: 8px;
    font-size: 13px; display: flex; align-items: center; gap: 8px;
  }
  .online-user .dot { width: 6px; height: 6px; border-radius: 50%; background: #4ade80; }
  .panel-backdrop {
    position: fixed; inset: 0; background: rgba(0,0,0,0.3);
    z-index: 140; display: none;
  }
  .panel-backdrop.show { display: block; }
</style>
</head>
<body>

<!-- 登录面板 -->
<div class="login-overlay" id="loginOverlay">
  <div class="login-box">
    <h2 class="special-title">🔴 红中密聊</h2>
    <p class="sub">输入昵称和房间号即可开始</p>
    <label>昵称</label>
    <input id="loginNick" placeholder="给自己取个名字" maxlength="12" />
    <label>房间号</label>
    <input id="loginRoom" placeholder="例如：lobby / 摸鱼 / 技术交流" value="lobby" />
    <label>服务器地址（可选，留空自动适配）</label>
    <input id="loginServer" placeholder="wss://你的域名 或 ws://IP:端口" />
    <button onclick="joinChat()">进入聊天室</button>
    <p class="sub" style="margin-top:18px;">
      <span class="status-dot disconnected" id="connDot"></span>
      <span id="connText">未连接</span>
    </p>
  </div>
</div>

<!-- 聊天主界面 -->
<div class="chat-container" id="chatContainer" style="display:none;">
  <div class="chat-header">
    <div>
      <div class="title special-title" id="headerTitle">🔴 红中密聊</div>
      <div class="room-info" id="headerRoom">房间：lobby</div>
    </div>
    <div class="right">
      <span class="online-badge" id="onlineBadge" onclick="toggleOnlinePanel()">👥 0</span>
    </div>
  </div>
  <div class="messages" id="messages"></div>
  <div class="typing-indicator" id="typingIndicator"></div>
  <div class="input-area">
    <input id="msgInput" placeholder="输入消息..." autocomplete="off" disabled />
    <button id="sendBtn" onclick="sendMessage()" disabled>发送</button>
  </div>
</div>

<!-- 在线列表 -->
<div class="panel-backdrop" id="panelBackdrop" onclick="toggleOnlinePanel()"></div>
<div class="online-panel" id="onlinePanel">
  <h3>👥 在线成员</h3>
  <div id="onlineList"></div>
</div>

<script>
// ===== 状态 =====
let ws = null;
let nickname = '';
let roomId = '';
let typingTimer = null;
let isTyping = false;

// ===== 连接 WebSocket =====
function joinChat() {
  const nick = document.getElementById('loginNick').value.trim();
  const room = document.getElementById('loginRoom').value.trim() || 'lobby';
  if (!nick) { alert('请输入昵称'); return; }

  nickname = nick;
  roomId = room;

  // 服务器地址：默认用当前域名，可在登录框下方手动填（调试用）
  const serverAddr = document.getElementById('loginServer')?.value.trim();
  let wsUrl;
  if (serverAddr) {
    wsUrl = serverAddr.startsWith('ws') ? serverAddr : `wss://${serverAddr}`;
  } else {
    const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
    wsUrl = `${proto}//${location.host}`;
  }
  connectWS(wsUrl);
}

function connectWS(url) {
  setConnStatus('connecting', '连接中...');
  try {
    ws = new WebSocket(url);
  } catch(e) {
    setConnStatus('disconnected', '连接失败');
    return;
  }

  ws.onopen = () => {
    setConnStatus('connected', '已连接');
    ws.send(JSON.stringify({ type: 'join', nickname, room: roomId }));
    document.getElementById('loginOverlay').style.display = 'none';
    document.getElementById('chatContainer').style.display = 'flex';
    document.getElementById('headerTitle').textContent = `💬 ${nickname}`;
    document.getElementById('headerRoom').textContent = `房间：${roomId}`;
    document.getElementById('msgInput').disabled = false;
    document.getElementById('sendBtn').disabled = false;
    document.getElementById('msgInput').focus();
  };

  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    handleMessage(msg);
  };

  ws.onclose = () => {
    setConnStatus('disconnected', '已断开');
    document.getElementById('msgInput').disabled = true;
    document.getElementById('sendBtn').disabled = true;
    addSystemMsg('连接已断开，正在尝试重连...');
    setTimeout(() => {
      if (ws.readyState !== WebSocket.OPEN) {
        const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
        connectWS(`${proto}//${location.host}`);
      }
    }, 3000);
  };

  ws.onerror = () => setConnStatus('disconnected', '连接错误');
}

function setConnStatus(state, text) {
  const dot = document.getElementById('connDot');
  dot.className = 'status-dot ' + state;
  document.getElementById('connText').textContent = text;
}

// ===== 消息处理 =====
function handleMessage(msg) {
  switch (msg.type) {
    case 'joined':
      addSystemMsg(`✅ 欢迎 ${msg.nickname}，你已加入房间「${msg.room}」`);
      break;
    case 'message':
      renderMessage(msg);
      break;
    case 'system':
      addSystemMsg(msg.text);
      break;
    case 'online':
      updateOnlineList(msg.users);
      break;
    case 'typing':
      showTyping(msg.author, msg.isTyping);
      break;
  }
}

function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || ws.readyState !== WebSocket.OPEN) return;

  ws.send(JSON.stringify({ type: 'message', text }));
  input.value = '';
  stopTyping();
}

// ===== 打字提示 =====
function showTyping(author, typing) {
  const el = document.getElementById('typingIndicator');
  el.textContent = typing ? `✍️ ${author} 正在输入...` : '';
}

document.getElementById('msgInput').addEventListener('input', () => {
  if (!isTyping) {
    isTyping = true;
    ws.send(JSON.stringify({ type: 'typing', isTyping: true }));
  }
  clearTimeout(typingTimer);
  typingTimer = setTimeout(stopTyping, 2000);
});

document.getElementById('msgInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') sendMessage();
});

function stopTyping() {
  if (isTyping && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'typing', isTyping: false }));
  }
  isTyping = false;
}

// ===== 在线列表 =====
function updateOnlineList(users) {
  document.getElementById('onlineBadge').textContent = `👥 ${users.length}`;
  const list = document.getElementById('onlineList');
  list.innerHTML = users.map(u => `<div class="online-user"><span class="dot"></span>${escapeHtml(u)}</div>`).join('');
}

function toggleOnlinePanel() {
  document.getElementById('onlinePanel').classList.toggle('open');
  document.getElementById('panelBackdrop').classList.toggle('show');
}

// ===== 渲染 =====
function renderMessage(msg) {
  const box = document.getElementById('messages');
  const div = document.createElement('div');
  const isSelf = msg.author === nickname;
  div.className = isSelf ? 'msg msg-self' : 'msg msg-other';
  div.innerHTML = `
    ${isSelf ? '' : `<div class="msg-author">${escapeHtml(msg.author)}</div>`}
    <div>${escapeHtml(msg.text)}</div>
    <div class="msg-time">${msg.time}</div>
  `;
  box.appendChild(div);
  scrollBottom();
}

function addSystemMsg(text) {
  const box = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg msg-system';
  div.textContent = text;
  box.appendChild(div);
  scrollBottom();
}

function scrollBottom() {
  const box = document.getElementById('messages');
  box.scrollTop = box.scrollHeight;
}

function escapeHtml(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

// 回车也能触发加入
document.getElementById('loginNick').addEventListener('keydown', e => { if(e.key==='Enter') joinChat(); });
document.getElementById('loginRoom').addEventListener('keydown', e => { if(e.key==='Enter') joinChat(); });
</script>
</body>
</html>
