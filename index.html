<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>娱乐聊天室</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            color: #fff;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            display: flex;
            gap: 20px;
            height: 100vh;
        }
        .sidebar {
            width: 250px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .panel {
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .login-panel { text-align: center; }
        .login-panel h1 { margin-bottom: 20px; font-size: 24px; }
        .login-panel input {
            width: 100%;
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.15);
            color: #fff;
            font-size: 16px;
            margin-bottom: 12px;
            outline: none;
        }
        .login-panel input::placeholder { color: rgba(255,255,255,0.5); }
        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.2s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(102,126,234,0.4); }
        .btn-success {
            background: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            color: #fff;
        }
        .btn-danger {
            background: linear-gradient(135deg, #eb3349 0%, #f45c43 100%);
            color: #fff;
        }
        .btn-warning {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: #fff;
        }
        .btn-secondary {
            background: rgba(255,255,255,0.15);
            color: #fff;
        }
        .players-panel h3 { margin-bottom: 15px; font-size: 18px; }
        .player-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 8px;
            background: rgba(255,255,255,0.05);
        }
        .player-item.active { background: rgba(102,126,234,0.3); }
        .player-avatar {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }
        .player-info { flex: 1; }
        .player-name { font-weight: 600; }
        .player-status { font-size: 12px; opacity: 0.7; }
        .chat-panel { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            margin-bottom: 15px;
            padding-right: 5px;
        }
        .chat-messages::-webkit-scrollbar { width: 6px; }
        .chat-messages::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
        .message {
            margin-bottom: 12px;
            padding: 10px 14px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            max-width: 80%;
        }
        .message.own { margin-left: auto; background: rgba(102,126,234,0.3); }
        .message.system {
            margin-left: auto;
            margin-right: auto;
            background: rgba(255,255,255,0.1);
            font-style: italic;
            opacity: 0.8;
            text-align: center;
            max-width: 100%;
        }
        .msg-sender { font-size: 12px; opacity: 0.7; margin-bottom: 4px; }
        .msg-content { word-break: break-word; }
        .chat-input {
            display: flex;
            gap: 10px;
        }
        .chat-input input {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 10px;
            background: rgba(255,255,255,0.15);
            color: #fff;
            font-size: 16px;
            outline: none;
        }
        .chat-input input::placeholder { color: rgba(255,255,255,0.5); }
        .game-panel { margin-top: 20px; }
        .game-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .game-title { font-size: 20px; font-weight: 600; }
        .game-controls { display: flex; gap: 10px; }
        .game-area { min-height: 200px; }
        
        /* 炸金花样式 */
        .zjh-table {
            background: linear-gradient(180deg, #0d5016 0%, #0a3d12 100%);
            border-radius: 50%;
            padding: 40px;
            position: relative;
            min-height: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .zjh-pot {
            font-size: 24px;
            font-weight: bold;
            color: #ffd700;
            margin-bottom: 20px;
        }
        .zjh-players {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }
        .zjh-player {
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 15px;
            min-width: 140px;
            text-align: center;
            border: 2px solid transparent;
        }
        .zjh-player.current { border-color: #ffd700; box-shadow: 0 0 15px rgba(255,215,0,0.5); }
        .zjh-player.folded { opacity: 0.5; }
        .zjh-player.allin { border-color: #ff4444; }
        .zjh-player-name { font-weight: 600; margin-bottom: 8px; }
        .zjh-player-chips { color: #ffd700; font-size: 14px; }
        .zjh-player-bet { color: #aaa; font-size: 12px; }
        .zjh-cards {
            display: flex;
            gap: 6px;
            justify-content: center;
            margin-top: 10px;
        }
        .zjh-card {
            width: 50px;
            height: 70px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            background: #fff;
            color: #333;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }
        .zjh-card.red { color: #e74c3c; }
        .zjh-card.black { color: #2c3e50; }
        .zjh-card.back {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: transparent;
        }
        .zjh-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 20px;
        }
        .zjh-actions input {
            width: 100px;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: rgba(255,255,255,0.15);
            color: #fff;
            text-align: center;
        }
        
        /* 跑得快样式 */
        .pdk-table {
            background: linear-gradient(180deg, #1a472a 0%, #0d3018 100%);
            border-radius: 20px;
            padding: 30px;
            min-height: 500px;
        }
        .pdk-players {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
        }
        .pdk-player {
            background: rgba(0,0,0,0.3);
            border-radius: 12px;
            padding: 15px;
            min-width: 120px;
            text-align: center;
            border: 2px solid transparent;
        }
        .pdk-player.current { border-color: #ffd700; }
        .pdk-player.finished { border-color: #38ef7d; }
        .pdk-player-name { font-weight: 600; }
        .pdk-player-count { color: #ffd700; font-size: 14px; margin-top: 5px; }
        .pdk-last-play {
            text-align: center;
            margin-bottom: 20px;
            min-height: 60px;
        }
        .pdk-last-play-label { color: #aaa; margin-bottom: 10px; }
        .pdk-discard-cards {
            display: flex;
            gap: 5px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .pdk-card {
            width: 45px;
            height: 65px;
            border-radius: 6px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 16px;
            background: #fff;
            color: #333;
            box-shadow: 0 2px 6px rgba(0,0,0,0.3);
        }

        .pdk-card.black { color: #2c3e50; }

            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
        }
