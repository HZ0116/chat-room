<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>红中密聊 · 娱乐聊天室</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
            min-height: 100vh;
            color: #fff;
            overflow: hidden;
        }

        /* ========== 登录页 ========== */
        #loginPage {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            z-index: 1000;
        }

        #loginPage.hidden {
            display: none;
        }

        .login-box {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            border-radius: 24px;
            padding: 48px 40px;
            width: 400px;
            max-width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
        }

        .login-box h1 {
            font-size: 32px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: center;
        }

        .login-box .subtitle {
            text-align: center;
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin-bottom: 32px;
        }

        .login-box input {
            width: 100%;
            padding: 14px 18px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
            margin-bottom: 12px;
        }

        .login-box input::placeholder {
            color: rgba(255, 255, 255, 0.4);
        }

        .login-box input:focus {
            background: rgba(255, 255, 255, 0.18);
            box-shadow: 0 0 0 2px rgba(102, 126, 234, 0.4);
        }

        .login-box .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
        }

        .login-box .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(102, 126, 234, 0.4);
        }

        .login-box .btn:active {
            transform: translateY(0);
        }

        .login-box .error-msg {
            color: #f5576c;
            font-size: 14px;
            text-align: center;
            margin-top: 12px;
            min-height: 20px;
        }

        /* ========== 主界面 ========== */
        #app {
            display: none;
            height: 100vh;
            padding: 16px;
            gap: 16px;
        }

        #app.active {
            display: flex;
        }

        /* ========== 侧边栏 ========== */
        .sidebar {
            width: 240px;
            min-width: 200px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .panel {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 18px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .panel-title {
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 14px;
        }

        .room-info {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 8px;
        }

        .room-info strong {
            color: #fff;
        }

        .player-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .player-list::-webkit-scrollbar {
            width: 4px;
        }

        .player-list::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }

        .player-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 10px;
            margin-bottom: 4px;
            transition: background 0.2s;
        }

        .player-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .player-item .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            font-weight: 600;
            flex-shrink: 0;
        }

        .player-item .name {
            font-size: 14px;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .player-item .status {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.3);
        }

        .player-item .status.online {
            color: #38ef7d;
        }

        /* ========== 主区域 ========== */
        .main {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            min-width: 0;
        }

        /* ========== 聊天区 ========== */
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            overflow: hidden;
            min-height: 0;
        }

        .chat-header {
            padding: 14px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            font-size: 14px;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }

        .chat-header .online-count {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 400;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
        }

        .chat-messages::-webkit-scrollbar {
            width: 4px;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
        }

        .message {
            margin-bottom: 12px;
            max-width: 75%;
            animation: fadeIn 0.2s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(6px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.own {
            margin-left: auto;
        }

        .message .msg-meta {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 3px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .message .msg-meta .name {
            font-weight: 600;
            color: rgba(255, 255, 255, 0.7);
        }

        .message .msg-bubble {
            padding: 10px 16px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.08);
            word-break: break-word;
            font-size: 15px;
            line-height: 1.5;
        }

        .message.own .msg-bubble {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.4), rgba(118, 75, 162, 0.4));
        }

        .message.system .msg-bubble {
            background: rgba(255, 255, 255, 0.05);
            color: rgba(255, 255, 255, 0.5);
            font-style: italic;
            text-align: center;
            max-width: 100%;
        }

        .message.system {
            max-width: 100%;
            margin-left: auto;
            margin-right: auto;
        }

        .chat-input-area {
            padding: 12px 20px 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            gap: 10px;
            flex-shrink: 0;
        }

        .chat-input-area input {
            flex: 1;
            padding: 12px 16px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: background 0.2s;
        }

        .chat-input-area input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }

        .chat-input-area input:focus {
            background: rgba(255, 255, 255, 0.14);
        }

        .chat-input-area .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
        }

            trans
